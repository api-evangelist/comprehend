name: Comprehend
description: >-
  Comprehend Systems, Inc. was a clinical-trials software company that built
  SaaS analytics for the life-sciences industry. Its flagship product,
  Comprehend Clinical, let clinical data managers and executives monitor
  studies and make real-time decisions across multiple source systems without
  moving the underlying data. The company raised a Lightspeed Venture Partners
  Series B in 2014 and was acquired by Saama Technologies in 2019, after which
  the standalone Comprehend product and the comprehend.com domain were retired.
  This API Evangelist profile is a Lightspeed portfolio lead; the company is
  defunct as an independent entity and publishes no live developer portal,
  API, documentation, or SDKs.
